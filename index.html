<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define a codificação dos caracteres da página -->
    <meta charset="UTF-8">

    <!-- Permite adaptar a página para diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>

    <!-- Define a aparência da página usando CSS -->
    <style>
        /* Configura a aparência geral da página */
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f0f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* Estiliza o título principal */
        h1 {
            color: #563d7c;
            margin-bottom: 30px;
        }

        /* Organiza os cartões dos sites */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        /* Cria um cartão para cada site favorito */
        .site {
            background-color: white;
            width: 200px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Estiliza o nome de cada site */
        .site h2 {
            color: #563d7c;
            font-size: 20px;
        }

        /* Define o tamanho das imagens */
        .site img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        /* Estiliza os links dos sites */
        .site a {
            display: inline-block;
            margin-top: 15px;
            color: #7b2cbf;
            text-decoration: none;
            font-weight: bold;
        }

        /* Muda a aparência do link quando o mouse passa por cima */
        .site a:hover {
            color: #e76f51;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Título principal que aparece no corpo da página -->
    <h1>Meus sites favoritos: Adriele Brisa De Santana Silva</h1>

    <!-- Área que contém os cinco sites favoritos -->
    <div class="container">

        <!-- Primeiro site favorito: YouTube -->
        <div class="site">
            <h2>YouTube</h2>

            <!-- Imagem do YouTube com link para o site -->
            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
                <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128"
                     alt="Logotipo do YouTube">
            </a>

            <!-- Link para acessar o YouTube -->
            <br>
            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
                Acessar site
            </a>
        </div>

        <!-- Segundo site favorito: Pinterest -->
        <div class="site">
            <h2>Pinterest</h2>

            <!-- Imagem do Pinterest com link para o site -->
            <a href="https://www.pinterest.com/" target="_blank" rel="noopener noreferrer">
                <img src="https://www.google.com/s2/favicons?domain=pinterest.com&sz=128"
                     alt="Logotipo do Pinterest">
            </a>

            <!-- Link para acessar o Pinterest -->
            <br>
            <a href="https://www.pinterest.com/" target="_blank" rel="noopener noreferrer">
                Acessar site
            </a>
        </div>

        <!-- Terceiro site favorito: Spotify -->
        <div class="site">
            <h2>Spotify</h2>

            <!-- Imagem do Spotify com link para o site -->
            <a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer">
                <img src="https://www.google.com/s2/favicons?domain=spotify.com&sz=128"
                     alt="Logotipo do Spotify">
            </a>

            <!-- Link para acessar o Spotify -->
            <br>
            <a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer">
                Acessar site
            </a>
        </div>

        <!-- Quarto site favorito: Netflix -->
        <div class="site">
            <h2>Netflix</h2>

            <!-- Imagem da Netflix com link para o site -->
            <a href="https://www.netflix.com/" target="_blank" rel="noopener noreferrer">
                <img src="https://www.google.com/s2/favicons?domain=netflix.com&sz=128"
                     alt="Logotipo da Netflix">
            </a>

            <!-- Link para acessar a Netflix -->
            <br>
            <a href="https://www.netflix.com/" target="_blank" rel="noopener noreferrer">
                Acessar site
            </a>
        </div>

        <!-- Quinto site favorito: Instagram -->
        <div class="site">
            <h2>Instagram</h2>

            <!-- Imagem do Instagram com link para o site -->
            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
                <img src="https://www.google.com/s2/favicons?domain=instagram.com&sz=128"
                     alt="Logotipo do Instagram">
            </a>

            <!-- Link para acessar o Instagram -->
            <br>
            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
                Acessar site
            </a>
        </div>

    </div>

</body>
</html>
